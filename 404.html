<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- P3-2 (аудит 66.56): CSP как на лендингах — защита одинакова на всех
         обслуживаемых HTML; script-src 'unsafe-inline' сохраняет работу
         inline-локале-детекта 66.53 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://mc.yandex.ru https://*.mc.yandex.ru; media-src 'self'; connect-src 'self' https://mc.yandex.ru https://*.mc.yandex.ru wss://mc.yandex.ru wss://*.mc.yandex.ru; frame-src 'self' https://mc.yandex.ru; object-src 'none'; base-uri 'self'; form-action 'self' https://boosty.to https://yoomoney.ru https://vk.ru">
    <meta name="robots" content="noindex">
    <title>404 — Свиток утерян | Летописи Руси XV века</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #2a2018 0%, #1a1410 55%, #100c08 100%);
            color: #e8dcc0;
            font-family: Georgia, 'PT Serif', serif;
            text-align: center;
            padding: 24px;
        }
        .scroll {
            max-width: 560px;
            border: 1px solid rgba(201, 169, 97, 0.4);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            background: linear-gradient(160deg, rgba(201, 169, 97, 0.07), rgba(0, 0, 0, 0.2));
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        }
        .code {
            font-size: clamp(4.5rem, 14vw, 7rem);
            font-weight: bold;
            color: #c9a961;
            line-height: 1;
            letter-spacing: 0.05em;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
        }
        h1 {
            font-size: 1.4rem;
            color: #e8dcc0;
            margin: 1rem 0 0.6rem;
        }
        p {
            color: #b8a888;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.8rem;
        }
        .actions {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        a.btn {
            display: inline-block;
            padding: 0.7rem 1.6rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            border: 1px solid rgba(201, 169, 97, 0.5);
            color: #e8dcc0;
            transition: background 0.25s ease, transform 0.25s ease;
        }
        a.btn:hover { background: rgba(201, 169, 97, 0.12); transform: translateY(-2px); }
        a.btn.primary { background: #8b2c1a; border-color: #b53925; color: #f0e6cc; }
        a.btn.primary:hover { background: #b53925; }
        @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
    </style>
</head>
<body>
    <main class="scroll">
        <div class="code">404</div>
        <h1>Свиток утерян</h1>
        <p>Страница, которую вы ищете, исчезла из летописей — возможно, её унесло ветрами Орды или она так и не была написана летописцем.</p>
        <div class="actions">
            <a class="btn primary" href="/">← На главную</a>
            <a class="btn" href="/game/">Играть в демо ⚔️</a>
        </div>
    </main>
    <script>
    // Аудит P2-2: GitHub Pages отдаёт корневой 404.html на ЛЮБОЙ отсутствующий
    // путь, включая /en/… — для EN-посетителей подменяем тексты на лету.
    (function () {
        if (!/^\/en(\/|$)/.test(location.pathname)) return;
        document.documentElement.lang = 'en';
        document.title = '404 — The scroll is lost | The Chronicles of Ruthenia';
        document.querySelector('h1').textContent = 'The scroll is lost';
        document.querySelector('p').textContent = 'The page you are looking for has vanished from the chronicles — perhaps the winds of the Horde have carried it away, or perhaps the chronicler never wrote it at all.';
        document.querySelector('a.btn.primary').textContent = '← Back to the front page';
        document.querySelector('a.btn:not(.primary)').textContent = 'Play the demo \u2694\uFE0F';
    })();
    </script>
</body>
</html>
