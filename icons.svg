<?xml version="1.0" encoding="UTF-8"?>
<!-- ============================================================
     SVG-спрайт «Летописи Руси XV века»
     Один символ — один источник правды.
     Использование в HTML:
       <svg class="icon"><use href="icons.svg#icon-shield"/></svg>
     Все иконки используют currentColor — наследуют цвет от CSS.
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">

