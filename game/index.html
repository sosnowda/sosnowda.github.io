<!-- 66.48 (аудит №18): CSP страницы игры. 'unsafe-inline' в script-src —
     инлайн-лоадер сцен и глушитель F1 ниже по коду; import() сцен — 'self';

     /game/vendor/phaser.min.js — внешний CDN из script-src УБРАН,
     внешних скриптов у игры больше нет;
     style 'unsafe-inline' — инлайн-блок разметки и errorEl.innerHTML.
     66.50: img-src + blob: — Phaser 3.88 грузит ВСЕ картинки через
     XHR→createObjectURL→<img> (внутренний конвейер лоадера), без blob:
     каждая текстура «Failed to process file» и игра стартует без спрайтов
     (TypeError setCurrentFrame в цикле). Лендинги уже защищены с 66.47;
     frame-ancestors в meta не работает по спецификации и потому не указан -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">

{"@context":"https://schema.org","@type":"VideoGame","name":"Летописи Руси XV века — Браузерное демо","description":"Браузерное демо на Phaser 3: деревня Холм Великий, сезонные работы, слухи на постоялом дворе, охота на вора. Ролевая система BRP d100.","genre":["RPG","Historical"],"applicationCategory":"Game","operatingSystem":"Web Browser","url":"https://sosnowda.github.io/game/","image":"https://sosnowda.github.io/assets/images/og-demo.jpg","playMode":"SinglePlayer","inLanguage":["ru","en"],"author":{"@type":"Person","name":"sosnowda"},"offers":{"@type":"Offer","price":"0","priceCurrency":"RUB"}}

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#2e2118;font-family:Arial,sans-serif}
#game-container{width:100vw;height:100vh;position:relative}
#loading-text{color:#c9a961;font-size:1.2rem;text-align:center;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
#error-text{color:#c44;font-size:1rem;text-align:center;max-width:600px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none}
/* 66.63 (аудит 66.61, P3-2): sr-only — скрытый H1 страницы. Канвас занимает
   весь вьюпорт, видимый заголовок перекрывал бы игру; определение —
   бит-в-бит из styles.css (тот же паттерн, что у лендингов) */
.sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
}
</style>
</head>
<body>
<!-- 66.63 (аудит 66.61, P3-2): H1 страницы игры — sr-only (см. комментарий в
     <style>); первый заголовок документа — h2 ошибки загрузки идёт после него -->
<h1 class="sr-only">Летописи Руси XV века — Браузерное демо</h1>
<main id="game-container">
    <div id="loading-text">Загрузка игры…</div>
    <div id="error-text"></div>
</main>

<!-- Phaser 3.88.2 — САМОХОСТИНГ с 66.64 (аудит 66.61, P3-4): единственная
     внешняя зависимость игры устранена; файл бит-в-бит с jsdelivr и npm
     (sha256 397fc65bb751b2549b59c64647edf70300d604b742cd6be03d8298b8f35ca9d6);
     SW обслуживает /game/vendor/ той же cache-first веткой, что и ассеты -->
<script src="vendor/phaser.min.js"></script>
<!-- RexUI полностью убран — кнопки на чистом Phaser -->

<script>
// Раунд 56 (приказ владельца): F1 открывает СПРАВКУ ИГРЫ, а не браузера!
// Браузерное поведение клавиши F1 (справка браузера поверх игры) глушится
// на уровне документа ДО старта загрузки сцен. Игровые окна «❓ Помощь»
// открывают обработчики сцен keydown-F1 (Title, Village, Interior, Forest,
// Fork, Location, Combat, Apiary — раунд 32). preventDefault НЕ мешает
// обработчикам Phaser — событие продолжает всплывать по window.
(function () {
    var swallowF1 = function (e) {
        if (e.code === 'F1' || e.key === 'F1' || e.keyCode === 112) {
            e.preventDefault();
        }
    };
    window.addEventListener('keydown', swallowF1, { passive: false });
})();

window.addEventListener('load', function() {
    var loadingEl = document.getElementById('loading-text');
    var errorEl = document.getElementById('error-text');

    function showError(msg) {
        loadingEl.style.display = 'none';
        errorEl.innerHTML = '<h2 style="color:#c9a961;margin-bottom:1rem;">Игра не загрузилась</h2><p>' + msg + '</p>';
        errorEl.style.display = 'block';
    }

    if (typeof Phaser === 'undefined') {
        showError('Движок Phaser не загружен. Проверьте интернет.');
        return;
    }

    Promise.all([
        // 66.31 (п.1): PreloadScene — ПЕРВАЯ сцена (золотой прогресс-бар),
        // она сама запускает BootScene; порядок импортов важен.
        import('./src/scenes/PreloadScene.js'),
        import('./src/scenes/BootScene.js'),
        import('./src/scenes/TitleScene.js'),
        import('./src/scenes/CharacterSelectionScene.js'),
        // Раунды 60-61: CharacterAppearanceScene и CharacterGeneratorScene удалены
        // (старая модель героя, без кастомизации внешности)
        import('./src/scenes/VillageScene.js'),
        import('./src/scenes/InteriorScene.js'),
        import('./src/scenes/ForkScene.js'),
        import('./src/scenes/LocationScene.js'),
        import('./src/scenes/ForestScene.js'),
        import('./src/scenes/ApiaryScene.js'),
        import('./src/scenes/CombatScene.js'),
        import('./src/scenes/EndScene.js'),
        import('./src/scenes/CharacterScene.js'),
        import('./src/tools/ScreenshotDirector.js'),
    ]).then(function(modules) {
        // Раунд 32: последний модуль — директор скриншотов (?shot=...), не сцена
        var directorMod = modules[modules.length - 1];
        var sceneModules = modules.slice(0, -1);
        var scenes = sceneModules.map(function(m) {
            var keys = Object.keys(m);
            return m[keys[0]];
        });

        var config = {
            // Раунд 32: ?renderer=canvas — принудительный Canvas-рендер (для
            // детерминированных скриншотов через agent-browser: WebGL в headless
            // теряет контекст и снимки выходят пустыми). По умолчанию — AUTO.
            type: (new URLSearchParams(window.location.search).get('renderer') === 'canvas')
                ? Phaser.CANVAS : Phaser.AUTO,
            title: 'Летописи Руси',
            parent: 'game-container',
            // Раунд 20: ЛЮБОЕ разрешение пользователя — канвас = всё окно.
            // Scale.RESIZE: буфер = CSS-пиксели окна, сцены читают актуальные
            // размеры через this.scale, UI переезжает по анкорам (utils/ui.js).
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: '#2e2118',
            // 66.30 (хотфикс аудита): пиксель-арт БЕЗ сглаживания — ПРЯМО В РЕАЛЬНОЙ
            // ТОЧКЕ ВХОДА. Прежде pixelArt: true жил только в зеркале src/main.js,
            // который НЕ исполняется (BootScene импортирует сцены напрямую отсюда,
            // минуя src/main.js), поэтому фикс «мыла» 66.29 п.6 не работал в
            // рантайме. Спрайты при масштабах 1.5–2.5 — чёткие.
            pixelArt: true,
            physics: {
                default: 'arcade',
                arcade: { gravity: { x: 0, y: 0 }, debug: false }
            },
            scale: {
                mode: Phaser.Scale.RESIZE,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                expandParent: true
            },
            scene: scenes
            // RexUI плагин убран — не нужен
        };

        loadingEl.style.display = 'none';
        // Экспорт в window — для отладки и автоматизированного QA
        window.game = new Phaser.Game(config);
        // Раунд 32: отладочные сценарии скриншотов (?shot=menu|select|custom|
        // village|map|interior|priest|thief|combat) — без параметра ничего не делает
        if (directorMod && typeof directorMod.bootScreenshotDirector === 'function') {
            directorMod.bootScreenshotDirector();
        }
    }).catch(function(err) {
        console.error('Ошибка загрузки игры:', err);
        showError('Ошибка: ' + err.message);
    });
});
</script>
</body>
</html>
