<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Летописи Руси — Браузерное демо</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#1b2a1f;font-family:Arial,sans-serif}
#game-container{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
.loading{color:#c9a961;font-size:1.2rem;text-align:center;padding:2rem}
.error{color:#c44;font-size:1rem;text-align:center;padding:2rem;max-width:600px}
</style>
</head>
<body>
<div id="game-container"><div class="loading">Загрузка игры…</div></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"></script>
<script src="https://unpkg.com/phaser3-rex-plugins@1.1.65/dist/rexuiplugin.min.js"></script>

<script>
window.addEventListener('load', function() {
    if (typeof Phaser === 'undefined') {
        document.getElementById('game-container').innerHTML = '<div class="error">Не удалось загрузить движок Phaser.</div>';
        return;
    }

    var container = document.getElementById('game-container');
    container.innerHTML = '';

    // Проверяем загрузился ли RexUI (используем 'in window' — не вызывает ReferenceError)
    var hasRexUI = 'RexUIPlugin' in window;
    if (!hasRexUI) {
        console.warn('RexUI не загрузился с unpkg — пробуем jsdelivr...');
    }

    // Если RexUI не загрузился — пробуем jsdelivr синхронно
    if (!hasRexUI) {
        document.write('<script src="https://cdn.jsdelivr.net/npm/phaser3-rex-plugins@1.1.65/dist/rexuiplugin.min.js"><\/script>');
    }

    Promise.all([
        import('./src/scenes/BootScene.js'),
        import('./src/scenes/TitleScene.js'),
        import('./src/scenes/VillageScene.js'),
        import('./src/scenes/CombatScene.js'),
        import('./src/scenes/CharacterScene.js'),
    ]).then(function(modules) {
        var scenes = modules.map(function(m) {
            var keys = Object.keys(m);
            return m[keys[0]];
        });

        // Проверяем ещё раз после возможной догрузки
        hasRexUI = 'RexUIPlugin' in window;

        var config = {
            type: Phaser.AUTO,
            title: 'Летописи Руси',
            parent: 'game-container',
            width: 1280,
            height: 720,
            backgroundColor: '#1b2a1f',
            pixelArt: false,
            physics: {
                default: 'arcade',
                arcade: { gravity: { x: 0, y: 0 }, debug: false }
            },
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
            },
            scene: scenes
        };

        if (hasRexUI) {
            config.plugins = {
                scene: [{
                    key: 'rexUI',
                    plugin: window.RexUIPlugin,
                    mapping: 'rexUI'
                }]
            };
        } else {
            console.warn('RexUI не загружен — кнопки UI не будут созданы');
        }

        new Phaser.Game(config);
    }).catch(function(err) {
        console.error('Ошибка загрузки игры:', err);
        container.innerHTML = '<div class="error"><h2 style="color:#c9a961;margin-bottom:1rem;">Игра не загрузилась</h2><p>Ошибка: ' + err.message + '</p></div>';
    });
});
</script>
</body>
</html>
